openapi: 3.0.0
info:
  title: CAB System - Ride Booking API
  description: |
    API đặt xe cho hệ thống CAB.

    Chức năng:
    - Tạo yêu cầu đặt xe.
    - Xem thông tin yêu cầu đặt xe.
    - Hủy yêu cầu đặt xe.
    - Kiểm tra thông tin điểm đón và điểm đến.
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/iuh-8dd/Datxe/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Ride Booking
  description: API đặt xe
paths:
  /rides:
    post:
      tags:
      - Ride Booking
      summary: Create ride booking
      description: Khách hàng tạo yêu cầu đặt xe.
      operationId: createRide
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRideRequest"
        required: true
      responses:
        "201":
          description: Ride booking created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "400":
          description: Invalid booking information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
  /rides/{rideId}:
    get:
      tags:
      - Ride Booking
      summary: Get ride booking
      description: Xem thông tin một chuyến xe.
      operationId: getRide
      parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Ride found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "404":
          description: Ride not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Ride Booking
      summary: Cancel ride booking
      description: Khách hàng hủy yêu cầu đặt xe.
      operationId: cancelRide
      parameters:
      - name: rideId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Ride cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "400":
          description: Ride cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ride not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
components:
  schemas:
    Ride:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5001
        customerId:
          type: integer
          format: int64
          example: 1001
        driverId:
          type: integer
          format: int64
          nullable: true
          example: 2001
        pickupLocation:
          type: string
          example: "123 Nguyễn Trãi, Quận 1, TP.HCM"
        destination:
          type: string
          example: "456 Điện Biên Phủ, Bình Thạnh, TP.HCM"
        vehicleType:
          type: string
          example: car
          enum:
          - car
          - motorbike
        status:
          type: string
          example: searching
          enum:
          - searching
          - accepted
          - ongoing
          - completed
          - cancelled
        estimatedFare:
          type: number
          format: double
          example: 85000
        createdAt:
          type: string
          format: date-time
          example: 2026-08-28T10:30:00Z
    CreateRideRequest:
      required:
      - destination
      - paymentMethod
      - pickupLocation
      - vehicleType
      type: object
      properties:
        pickupLocation:
          type: string
          example: "123 Nguyễn Trãi, Quận 1, TP.HCM"
        destination:
          type: string
          example: "456 Điện Biên Phủ, Bình Thạnh, TP.HCM"
        vehicleType:
          type: string
          example: car
          enum:
          - car
          - motorbike
        paymentMethod:
          type: string
          example: online
          enum:
          - cash
          - card
          - online
    Error:
      required:
      - error_code
      - message
      type: object
      properties:
        error_code:
          type: string
          example: RIDE_NOT_FOUND
        message:
          type: string
          example: Ride not found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
